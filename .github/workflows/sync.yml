name: Sync Upstream (without ZIP)

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/XiaoFFGel/MikuMikuRig.git
          git fetch upstream main

      - name: Apply clean commits
        run: |
          TRACKER_FILE=".upstream_commit"
          LATEST_COMMIT=$(git rev-parse upstream/main)
          MAX_BLEND_SIZE=$((5 * 1024 * 1024)) # 5MB

          PREV_COMMIT=$(cat "$TRACKER_FILE")
          echo "Previous synced commit: $PREV_COMMIT"
          echo "Latest upstream commit: $LATEST_COMMIT"

          if [ "$PREV_COMMIT" != "$LATEST_COMMIT" ]; then
            echo "New commits detected. Analyzing files..."

            EXCLUDE_PATTERNS=(":(exclude)*.zip" ":(exclude)**/*.zip")

            # Exclude 5MB+ .blend
            while IFS=$'\t' read -r meta filepath; do
              size=$(echo "$meta" | awk '{print $4}')
              if [ -n "$size" ] && [ "$size" -gt "$MAX_BLEND_SIZE" ] 2>/dev/null; then
                echo "Excluding oversized .blend (>5MB): $filepath ($((size / 1024 / 1024))MB)"
                EXCLUDE_PATTERNS+=(":(exclude)$filepath")
              fi
            done < <(git ls-tree -r -l upstream/main | grep -E '\.blend$')

            # Generate upstream patch with --binary (without ZIP)
            git format-patch --binary "$PREV_COMMIT..upstream/main" --stdout -- "${EXCLUDE_PATTERNS[@]}" > patch.mail

            # Apply patch
            if [ -s patch.mail ]; then
              git am --empty=drop patch.mail
            fi

            # Push the changes & update reference
            echo "$LATEST_COMMIT" > "$TRACKER_FILE"
            git add "$TRACKER_FILE"
            git commit -m "chore: update upstream sync tracker to ${LATEST_COMMIT:0:7}"
            git push origin main
            echo "Successfully synced new commits!"
          else
            echo "No new clean commits to apply. Everything is up to date."
          fi
